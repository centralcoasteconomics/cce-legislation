name: nightly-legislative-log
on:
  schedule:
    # The Legislative Counsel republishes pubinfo_<year>.zip around 04:20 UTC. GitHub often
    # starts scheduled runs hours late, so this fires at 07:17 UTC (00:17 Pacific) to land
    # before the steward's morning pass even when delayed.
    - cron: "17 7 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from the Legislative Counsel archive
        run: python3 pipeline/build.py
      - name: Invariants (a false trackline never publishes)
        run: python3 tests/test_invariants.py
      - name: Editorial still points at real bills
        run: python3 tests/verify_editorial.py
      - name: Commit if anything moved
        run: |
          git config user.name "cce-legislation bot"
          git config user.email "centralcoasteconomics@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(python3 -c 'import json;m=json.load(open("data/meta.json"));print(m["today"], m["counts"])')"
          git push
